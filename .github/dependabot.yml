version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # TypeScript 7 drops the JS compiler API that typescript-eslint needs.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep the Node types on the Node major CI and the image run on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
